name: Topology Freshness

on:
  push:
    branches:
      - structural_realignment_propagation
      - 'structural_realignment_propagation*'
  pull_request:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - name: Build topology freshness regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src
          ESPressio-Mesh/tests/topology_freshness_test.cpp
          -o topology_freshness_test
      - name: Run topology freshness regression
        run: ./topology_freshness_test
