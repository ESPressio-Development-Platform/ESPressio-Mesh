name: Clock Coordination

on:
  push:
    branches:
      - structural_realignment_propagation
      - 'structural_realignment_propagation*'
  pull_request:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Radio
      - name: Build clock coordination regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src
          ESPressio-Mesh/tests/clock_coordination_test.cpp -o clock_coordination_test
      - name: Run clock coordination regression
        run: ./clock_coordination_test
      - name: Build authenticated clock membership regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src
          ESPressio-Mesh/tests/clock_membership_coordinator_test.cpp -o clock_membership_coordinator_test
      - name: Run authenticated clock membership regression
        run: ./clock_membership_coordinator_test
      - name: Build clock reachability convergence regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src
          ESPressio-Mesh/tests/clock_reachability_coordinator_test.cpp -o clock_reachability_coordinator_test
      - name: Run clock reachability convergence regression
        run: ./clock_reachability_coordinator_test
      - name: Build direct authenticated parent usability regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Radio/src
          ESPressio-Mesh/tests/clock_parent_usability_test.cpp -o clock_parent_usability_test
      - name: Run direct authenticated parent usability regression
        run: ./clock_parent_usability_test
