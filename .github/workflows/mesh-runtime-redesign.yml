name: Mesh clock and runtime redesign

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  host-runtime-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Threads
          ref: primitives_redesign
          path: Threads
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: Units
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - name: Compile Mesh clock reference ownership contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -ITiming/src -IRadio/src -ITask/src -IThreads/src -IUnits/src -IUnits/tests/stubs
          Mesh/tests/mesh_clock_reference_orchestration_test.cpp
          -o mesh_clock_reference_orchestration_test -pthread
      - name: Run Mesh clock reference ownership contract
        run: ./mesh_clock_reference_orchestration_test
      - name: Compile generic Thread Mesh runtime worker
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IThreads/src -ITask/src
          Mesh/tests/mesh_runtime_worker_redesign_test.cpp
          -o mesh_runtime_worker_redesign_test -pthread
      - name: Run generic Thread Mesh runtime worker surface
        run: ./mesh_runtime_worker_redesign_test
      - name: Reject predecessor Mesh worker mechanisms
        run: |
          ! grep -E 'PrecisionThread|std::function|<functional>|MaintenancePeriodMilliseconds|catch[[:space:]]*\(' Mesh/src/ESPressio_MeshRuntimeWorker.hpp
      - name: Compile fixed Mesh lifecycle sink
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src
          Mesh/tests/mesh_lifecycle_sink_test.cpp
          -o mesh_lifecycle_sink_test -pthread
      - name: Run fixed Mesh lifecycle sink
        run: ./mesh_lifecycle_sink_test
      - name: Compile Mesh Q1/runtime resource accounting against current Radio surface
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IPrimitive/src -IRadio/src -ITask/src -ITiming/src -IThreads/src -IUnits/src -IUnits/tests/stubs
          Mesh/tests/mesh_memory_accounting_test.cpp
          -o mesh_memory_accounting_test -pthread
      - name: Run Mesh Q1/runtime resource accounting
        run: ./mesh_memory_accounting_test
      - name: Reject predecessor dependencies and deleted RadioTransport accounting
        run: |
          ! grep -R -E 'ESPressio_Observable|ThreadSafeObservable|Observable::|ObserverHandle' Mesh/src Mesh/library.json
          ! grep -R -E 'ESPressio_RadioTransport|Radio::RadioTransport|RadioTransportBytes|RadioReassemblyPayloadBytes' Mesh/src/ESPressio_MeshMemoryAccounting.hpp Mesh/tests/mesh_memory_accounting_test.cpp
          ! grep -E 'ESPressio-Observable|ESPressio-Event|ESPressio-Command|ESPressio-State|ESPressio-Adapters' Mesh/library.json
          grep -q '"version": "1.0.0"' Mesh/library.json
