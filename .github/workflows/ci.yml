        run: ./admission_resources_test
      - name: Build admission promotion regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src
          ESPressio-Mesh/tests/admission_promotion_test.cpp -o admission_promotion_test -pthread
      - name: Run admission promotion regression
        run: ./admission_promotion_test
      - name: Build primitive receiver registry regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src
          ESPressio-Mesh/tests/primitive_receiver_registry_test.cpp -o primitive_receiver_registry_test -pthread
      - name: Run primitive receiver registry regression
        run: ./primitive_receiver_registry_test
      - name: Build Mesh radio/discovery regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src
          ESPressio-Mesh/tests/mesh_radio_discovery_test.cpp -o mesh_radio_discovery_test -pthread
      - name: Run Mesh radio/discovery regression
        run: ./mesh_radio_discovery_test
      - name: Build Mesh traffic governor regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src
          ESPressio-Mesh/tests/mesh_traffic_governor_test.cpp -o mesh_traffic_governor_test -pthread
      - name: Run Mesh traffic governor regression
        run: ./mesh_traffic_governor_test
      - name: Build Radio peer lifecycle cleanup regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
