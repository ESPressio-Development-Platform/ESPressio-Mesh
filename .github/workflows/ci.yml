name: CI

on:
  push:
    branches:
      - main
      - structural_realignment
      - 'structural_realignment_propagation*'
      - 'feature/**'
      - 'optimisation/**'
  pull_request:

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - name: Build Mesh core type regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src
          -IESPressio-System/src
          ESPressio-Mesh/tests/mesh_types_test.cpp
          -o mesh_types_test
      - name: Run Mesh core type regression
        run: ./mesh_types_test
      - name: Build membership tombstone regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src
          -IESPressio-System/src
          ESPressio-Mesh/tests/membership_tombstone_test.cpp
          -o membership_tombstone_test
      - name: Run membership tombstone regression
        run: ./membership_tombstone_test
      - name: Build deduplication window regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src
          ESPressio-Mesh/tests/deduplication_window_test.cpp
          -o deduplication_window_test
      - name: Run deduplication window regression
        run: ./deduplication_window_test
      - name: Build Mesh message ID generator regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src
          ESPressio-Mesh/tests/mesh_message_id_generator_test.cpp
          -o mesh_message_id_generator_test
      - name: Run Mesh message ID generator regression
        run: ./mesh_message_id_generator_test
      - name: Build inbound delivery reservation regression
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror
          -IESPressio-Mesh/src
          -IESPressio-System/src
          ESPressio-Mesh/tests/inbound_delivery_reservations_test.cpp
          -o inbound_delivery_reservations_test
      - name: Run inbound delivery reservation regression
        run: ./inbound_delivery_reservations_test
