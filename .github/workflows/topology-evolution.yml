name: Topology Evolution

on:
  push:
    branches:
      - structural_realignment_propagation
      - 'structural_realignment_propagation*'
  pull_request:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: structural_realignment
          path: ESPressio-Observable
      - name: Build topology publication regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/topology_publication_policy_test.cpp -o topology_publication_policy_test -pthread
      - name: Run topology publication regression
        run: ./topology_publication_policy_test
      - name: Build global topology graph regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/topology_graph_store_test.cpp -o topology_graph_store_test -pthread
      - name: Run global topology graph regression
        run: ./topology_graph_store_test
      - name: Build bounded route-cache regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/route_cache_test.cpp -o route_cache_test -pthread
      - name: Run bounded route-cache regression
        run: ./route_cache_test
      - name: Build routing policy regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESpressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/routing_policy_test.cpp -o routing_policy_test -pthread
      - name: Run routing policy regression
        run: ./routing_policy_test
      - name: Build route planner/attempt regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/route_planner_attempt_test.cpp -o route_planner_attempt_test -pthread
      - name: Run route planner/attempt regression
        run: ./route_planner_attempt_test
      - name: Build direct peer/forwarding transition regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/direct_peer_forwarding_transition_test.cpp -o direct_peer_forwarding_transition_test -pthread
      - name: Run direct peer/forwarding transition regression
        run: ./direct_peer_forwarding_transition_test
      - name: Build forwarding submission regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/forwarding_submission_test.cpp -o forwarding_submission_test -pthread
      - name: Run forwarding submission regression
        run: ./forwarding_submission_test
      - name: Build authenticated forwarding transition coordinator regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src ESPressio-Mesh/tests/forwarding_transition_coordinator_test.cpp -o forwarding_transition_coordinator_test -pthread
      - name: Run authenticated forwarding transition coordinator regression
        run: ./forwarding_transition_coordinator_test
      - name: Build forwarding attempt lifecycle regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/forwarding_attempt_lifecycle_test.cpp -o forwarding_attempt_lifecycle_test -pthread
      - name: Run forwarding attempt lifecycle regression
        run: ./forwarding_attempt_lifecycle_test
      - name: Build forwarding Radio terminal correlation regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/forwarding_radio_terminal_correlation_test.cpp -o forwarding_radio_terminal_correlation_test -pthread
      - name: Run forwarding Radio terminal correlation regression
        run: ./forwarding_radio_terminal_correlation_test
      - name: Build forwarding Radio attempt coordinator regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/forwarding_radio_attempt_coordinator_test.cpp -o forwarding_radio_attempt_coordinator_test -pthread
      - name: Run forwarding Radio attempt coordinator regression
        run: ./forwarding_radio_attempt_coordinator_test
      - name: Build delivery acknowledgement tracker regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src ESPressio-Mesh/tests/delivery_acknowledgement_tracker_test.cpp -o delivery_acknowledgement_tracker_test -pthread
      - name: Run delivery acknowledgement tracker regression
        run: ./delivery_acknowledgement_tracker_test
      - name: Build delivery acknowledgement coordinator regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src ESPressio-Mesh/tests/delivery_acknowledgement_coordinator_test.cpp -o delivery_acknowledgement_coordinator_test -pthread
      - name: Run delivery acknowledgement coordinator regression
        run: ./delivery_acknowledgement_coordinator_test
      - name: Build composed outbound delivery lifecycle regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/outbound_delivery_lifecycle_test.cpp -o outbound_delivery_lifecycle_test -pthread
      - name: Run composed outbound delivery lifecycle regression
        run: ./outbound_delivery_lifecycle_test
      - name: Build outbound Radio delivery correlation regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/outbound_radio_delivery_coordinator_test.cpp -o outbound_radio_delivery_coordinator_test -pthread
      - name: Run outbound Radio delivery correlation regression
        run: ./outbound_radio_delivery_coordinator_test
      - name: Build bounded application transmission aggregate regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src ESPressio-Mesh/tests/application_transmission_table_test.cpp -o application_transmission_table_test -pthread
      - name: Run bounded application transmission aggregate regression
        run: ./application_transmission_table_test
      - name: Build application transmission lifecycle composition regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_transmission_coordinator_test.cpp -o application_transmission_coordinator_test -pthread
      - name: Run application transmission lifecycle composition regression
        run: ./application_transmission_coordinator_test
      - name: Build Mesh security authority contract regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Radio/src ESPressio-Mesh/tests/mesh_security_authority_test.cpp -o mesh_security_authority_test -pthread
      - name: Run Mesh security authority contract regression
        run: ./mesh_security_authority_test
      - name: Build Mesh v1 security profile and canonical handshake regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src ESPressio-Mesh/tests/mesh_v1_security_test.cpp -o mesh_v1_security_test -pthread
      - name: Run Mesh v1 security profile and canonical handshake regression
        run: ./mesh_v1_security_test
      - name: Build transactional Mesh v1 responder admission regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src ESPressio-Mesh/tests/mesh_v1_responder_admission_coordinator_test.cpp -o mesh_v1_responder_admission_coordinator_test -pthread
      - name: Run transactional Mesh v1 responder admission regression
        run: ./mesh_v1_responder_admission_coordinator_test
      - name: Build transactional Mesh v1 initiator admission regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src ESPressio-Mesh/tests/mesh_v1_initiator_admission_coordinator_test.cpp -o mesh_v1_initiator_admission_coordinator_test -pthread
      - name: Run transactional Mesh v1 initiator admission regression
        run: ./mesh_v1_initiator_admission_coordinator_test
      - name: Build protected Mesh v1 application forwarding/destination regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/mesh_v1_application_protection_coordinator_test.cpp -o mesh_v1_application_protection_coordinator_test -pthread
      - name: Run protected Mesh v1 application forwarding/destination regression
        run: ./mesh_v1_application_protection_coordinator_test
      - name: Build current Mesh umbrella
        run: printf '#include <ESPressio_Mesh.hpp>\nint main(){return 0;}\n' > umbrella.cpp && g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src umbrella.cpp -o umbrella -pthread
