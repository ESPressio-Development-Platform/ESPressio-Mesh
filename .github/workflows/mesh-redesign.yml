name: Mesh redesign contracts

on:
  push:
    branches:
      - primitives_redesign
  pull_request:

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: primitives_redesign
          path: System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: primitives_redesign
          path: Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: primitives_redesign
          path: Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Task
          ref: primitives_redesign
          path: Task
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Timing
          ref: primitives_redesign
          path: Timing
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Units
          ref: primitives_redesign
          path: Units
      - name: Compile neutral M1 receiver registry contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IPrimitive/src
          Mesh/tests/primitive_receiver_registry_test.cpp
          -o primitive_receiver_registry_test -pthread
      - name: Run neutral M1 receiver registry contract
        run: ./primitive_receiver_registry_test
      - name: Compile atomic Mesh relay Q1 capacity contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src
          Mesh/tests/mesh_relay_capacity_test.cpp
          -o mesh_relay_capacity_test -pthread
      - name: Run atomic Mesh relay Q1 capacity contract
        run: ./mesh_relay_capacity_test
      - name: Compile Mesh relay membership capacity profile
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src
          Mesh/tests/mesh_relay_capacity_profile_test.cpp
          -o mesh_relay_capacity_profile_test -pthread
      - name: Run Mesh relay membership capacity profile
        run: ./mesh_relay_capacity_profile_test
      - name: Compile Mesh remaining-residence broadcast contract
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IPrimitive/src
          Mesh/tests/mesh_remaining_residence_test.cpp
          -o mesh_remaining_residence_test -pthread
      - name: Run Mesh remaining-residence broadcast contract
        run: ./mesh_remaining_residence_test
      - name: Compile Mesh Seen/Forwarded and DeferredLocal lifecycle
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IPrimitive/src
          Mesh/tests/mesh_broadcast_lifecycle_test.cpp
          -o mesh_broadcast_lifecycle_test -pthread
      - name: Run Mesh Seen/Forwarded and DeferredLocal lifecycle
        run: ./mesh_broadcast_lifecycle_test
      - name: Compile family-neutral Mesh broadcast policy gate
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -IPrimitive/src
          Mesh/tests/mesh_broadcast_policy_test.cpp
          -o mesh_broadcast_policy_test
      - name: Run family-neutral Mesh broadcast policy gate
        run: ./mesh_broadcast_policy_test
      - name: Compile managed Mesh-to-Radio submission mapping
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IRadio/src -ITask/src -ITiming/src -IUnits/src
          Mesh/tests/mesh_radio_submission_test.cpp
          -o mesh_radio_submission_test -pthread
      - name: Run managed Mesh-to-Radio submission mapping
        run: ./mesh_radio_submission_test
      - name: Compile replacement M2 broadcast coordinator
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -fno-rtti
          -IMesh/src -ISystem/src -IPrimitive/src -IRadio/src -ITask/src -ITiming/src -IUnits/src
          Mesh/tests/mesh_v1_broadcast_m2_test.cpp
          -o mesh_v1_broadcast_m2_test -pthread
      - name: Run replacement M2 broadcast coordinator
        run: ./mesh_v1_broadcast_m2_test
