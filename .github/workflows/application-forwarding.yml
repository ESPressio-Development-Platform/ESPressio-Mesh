name: Application Forwarding

on:
  push:
    branches:
      - structural_realignment_propagation
      - 'structural_realignment_propagation*'
  pull_request:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ESPressio-Mesh
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-System
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-System
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Primitive
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Primitive
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Radio
          ref: structural_realignment_propagation_ESPressio-Mesh
          path: ESPressio-Radio
      - uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/ESPressio-Observable
          ref: structural_realignment
          path: ESPressio-Observable
      - name: Build application transmission coordinator regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_transmission_coordinator_test.cpp -o application_transmission_coordinator_test -pthread
      - name: Run application transmission coordinator regression
        run: ./application_transmission_coordinator_test
      - name: Build outbound delivery lifecycle regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/outbound_delivery_lifecycle_test.cpp -o outbound_delivery_lifecycle_test -pthread
      - name: Run outbound delivery lifecycle regression
        run: ./outbound_delivery_lifecycle_test
      - name: Build application forwarding regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_forwarding_coordinator_test.cpp -o application_forwarding_coordinator_test -pthread
      - name: Run application forwarding regression
        run: ./application_forwarding_coordinator_test
      - name: Build application recipient lifecycle regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_recipient_lifecycle_test.cpp -o application_recipient_lifecycle_test -pthread
      - name: Run application recipient lifecycle regression
        run: ./application_recipient_lifecycle_test
      - name: Build application destination ACK regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_delivery_acknowledgement_test.cpp -o application_delivery_acknowledgement_test -pthread
      - name: Run application destination ACK regression
        run: ./application_delivery_acknowledgement_test
      - name: Build application Radio submission regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_radio_submission_coordinator_test.cpp -o application_radio_submission_coordinator_test -pthread
      - name: Run application Radio submission regression
        run: ./application_radio_submission_coordinator_test
      - name: Build application Radio terminal regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_radio_terminal_coordinator_test.cpp -o application_radio_terminal_coordinator_test -pthread
      - name: Run application Radio terminal regression
        run: ./application_radio_terminal_coordinator_test
      - name: Build application next-hop acceptance regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_next_hop_acceptance_coordinator_test.cpp -o application_next_hop_acceptance_coordinator_test -pthread
      - name: Run application next-hop acceptance regression
        run: ./application_next_hop_acceptance_coordinator_test
      - name: Build composed deadline retirement regression
        run: g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src ESPressio-Mesh/tests/application_deadline_radio_retirement_test.cpp -o application_deadline_radio_retirement_test -pthread
      - name: Run composed deadline retirement regression
        run: ./application_deadline_radio_retirement_test
      - name: Build current Mesh umbrella
        run: printf '#include <ESPressio_Mesh.hpp>\nint main(){return 0;}\n' > umbrella.cpp && g++ -std=c++17 -Wall -Wextra -Werror -IESPressio-Mesh/src -IESPressio-System/src -IESPressio-Primitive/src -IESPressio-Radio/src -IESPressio-Observable/src umbrella.cpp -o umbrella -pthread
