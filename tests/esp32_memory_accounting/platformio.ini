[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -std=gnu++17
    -I../../src
    -I../../../ESPressio-System/src
    -I../../../ESPressio-Primitive/src
    -I../../../ESPressio-Radio/src
    -I../../../ESPressio-Observable/src
    -I../../../ESPressio-Timing/src
    -I../../../ESPressio-Security/src
